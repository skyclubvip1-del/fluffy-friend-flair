      <defs>
        <filter id="gold-foil-specular" x="-20%" y="-20%" width="140%" height="140%">

          <feComposite operator="arithmetic" k1="0" k2="1" k3="1" k4="0" in="SourceGraphic" in2="composite" />
        </filter>
